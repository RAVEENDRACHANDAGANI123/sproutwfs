version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sprout_hr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sprout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprout_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sprout_hr_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sprout_user} -d ${POSTGRES_DB:-sprout_hr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
